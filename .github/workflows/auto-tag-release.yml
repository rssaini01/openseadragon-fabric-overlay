name: Release on Tag

on:
  workflow_run:
    workflows: [ "Build & Test" ]
    types: [ completed ]
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Get previous tag
        id: prev_tag
        env:
          PUSHED_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          prev_tag=$(git describe --tags --abbrev=0 --match "v*" "${PUSHED_TAG}^" 2>/dev/null || echo "")
          echo "tag=$prev_tag" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: release_notes
        env:
          TAG_NAME: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ -z "${{ steps.prev_tag.outputs.tag }}" ]; then
            echo "## What's Changed" >> release_notes.md
            echo "- Initial release" >> release_notes.md
          else
            echo "## What's Changed" >> release_notes.md
            git log ${{ steps.prev_tag.outputs.tag }}..HEAD --pretty=format:"- %s" --no-merges >> release_notes.md
            echo "" >> release_notes.md
            echo "**Full Changelog**: ${{ github.server_url }}/${{ github.repository }}/compare/${{ steps.prev_tag.outputs.tag }}...$TAG_NAME" >> release_notes.md
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.workflow_run.head_branch }}
          name: ${{ github.event.workflow_run.head_branch }}
          body: ${{ steps.release_notes.outputs.notes }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
